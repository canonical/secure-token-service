[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-harness2-openspec"
version = "0.1.0"
description = "Google harness2 recursive agent harnessing configured for Secure Token Service (Janus) OpenSpec workflows."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
harness2-openspec = "openspec_harness.cli:main"
harness2-demo = "harness2.cli.demo:main"
harness2-sweep = "harness2.cli.run_sweep:main"
harness2-judge = "harness2.cli.judge:main"
harness2-report = "harness2.cli.report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness2*", "openspec_harness*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
