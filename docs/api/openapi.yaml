openapi: 3.0.3
info:
  title: Secure Token Service (Janus) API  
  description: |
    Security Token Service implementing the Phantom Token Pattern for session management and JWT issuance.
    
    This service provides:
    - OIDC authentication with opaque session cookies
    - Session-to-JWT exchange for internal services (gRPC)
    - JWKS endpoint for JWT verification
  version: 1.0.0
  contact:
    name: Canonical Identity Team
    url: https://github.com/canonical/secure-token-service

servers:
  - url: https://sts.example.com
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Authentication
    description: OIDC authentication flow
  - name: JWKS
    description: JSON Web Key Set endpoint
  - name: Health
    description: Service health and metrics

paths:
  /auth/login:
    get:
      summary: Initiate login flow
      description: |
        Redirects to the upstream authentication provider (OIDC or Ubuntu One OpenID 2.0).
        Sets encrypted auth state cookie for CSRF protection and flow context.
        The Secure cookie flag is dynamically enabled when accessed via HTTPS or behind a TLS-terminating proxy.
      tags:
        - Authentication
      parameters:
        - name: provider
          in: query
          description: |
            Authentication provider to use: 'oidc' or 'openid'.
            If omitted, falls back to the configured DEFAULT_AUTH_PROVIDER (defaults to 'oidc').
          required: false
          schema:
            type: string
            enum: ["oidc", "openid"]
            example: "openid"
        - name: return_to
          in: query
          description: |
            URL to redirect to after successful login (default: "/").
            Must be a path-relative URL (e.g. "/dashboard") or an absolute URL matching
            the request host or configured allowed return-to hosts.
            Unsafe or external URLs will be rejected with HTTP 400 Bad Request.
          required: false
          schema:
            type: string
            example: "/dashboard"
      responses:
        '302':
          description: Redirect to upstream authentication provider
          headers:
            Location:
              schema:
                type: string
                example: "https://login.ubuntu.com/+openid?openid.mode=checkid_setup&..."
            Set-Cookie:
              description: Encrypted auth state cookie with dynamic Secure attribute
              schema:
                type: string
                example: "oauth_state=...; Path=/; HttpOnly; SameSite=Lax"
        '400':
          description: Bad request (invalid return_to parameter or unsupported provider)
          content:
            text/plain:
              schema:
                type: string
                example: "Unsupported authentication provider"

  /auth/callback:
    get:
      summary: OIDC callback endpoint
      description: |
        Handles OIDC provider callback after user authentication.
        Exchanges authorization code for tokens, creates session, and sets standardized session cookie.
      tags:
        - Authentication
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from OIDC provider
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: CSRF state parameter
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error from OIDC provider
          schema:
            type: string
            enum: ["access_denied", "invalid_request", "unauthorized_client"]
        - name: error_description
          in: query
          required: false
          description: Human-readable error description
          schema:
            type: string
      responses:
        '302':
          description: |
            Successful authentication, redirect to return_to URL.
            If return_to in state is missing or invalid, safely falls back to "/".
          headers:
            Location:
              schema:
                type: string
                example: "/dashboard"
            Set-Cookie:
              description: Standardized session cookie with dynamic Secure attribute
              schema:
                type: string
                example: "session_id=...; Path=/; HttpOnly; SameSite=Lax; Max-Age=3600"
        '400':
          description: Bad request (invalid state, missing code, OIDC error)
          content:
            text/plain:
              schema:
                type: string
                example: "Invalid state parameter"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Failed to exchange authorization code"

  /auth/openid/callback:
    get:
      summary: Ubuntu One OpenID 2.0 callback endpoint
      description: |
        Handles Ubuntu One OpenID 2.0 callback verification via direct check_authentication POST.
        Extracts user identity (email/nickname/claimed_id) and attribute exchange claims, creates session,
        and sets standardized session cookie.
      tags:
        - Authentication
      parameters:
        - name: openid.mode
          in: query
          required: true
          description: OpenID mode parameter (e.g. id_res or cancel)
          schema:
            type: string
        - name: openid.identity
          in: query
          required: false
          description: Claimed identifier URL
          schema:
            type: string
        - name: openid.return_to
          in: query
          required: false
          description: Return URL passed during redirection
          schema:
            type: string
        - name: openid.response_nonce
          in: query
          required: false
          description: OpenID verification nonce
          schema:
            type: string
      responses:
        '302':
          description: |
            Successful authentication, redirect to return_to URL.
            If return_to in state is missing or invalid, safely falls back to "/".
          headers:
            Location:
              schema:
                type: string
                example: "/dashboard"
            Set-Cookie:
              description: Standardized session cookie with dynamic Secure attribute
              schema:
                type: string
                example: "session_id=...; Path=/; HttpOnly; SameSite=Lax; Max-Age=3600"
        '400':
          description: Bad request (authentication canceled or invalid parameters)
          content:
            text/plain:
              schema:
                type: string
                example: "Authentication canceled by user"
        '401':
          description: Unauthorized (OpenID verification failed)
          content:
            text/plain:
              schema:
                type: string
                example: "OpenID verification failed"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Failed to create session"


 /auth/logout:
    post:
      summary: Logout and destroy session  
      description: |
        Terminates the user session and clears the session cookie.
        Session is deleted from Valkey storage.
      tags:
        - Authentication
      parameters:
        - name: Cookie
          in: header
          required: true
          description: Session cookie
          schema:
            type: string
            example: "session_id=uuid"
      responses:
        '200':
          description: Successfully logged out
          headers:
            Set-Cookie:
              description: Cleared session cookie
              schema:
                type: string
                example: "session_id=; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"
        '500':
          description: Failed to delete session
          content:
            text/plain:
              schema:
                type: string

  /.well-known/jwks.json:
    get:
      summary: Get JSON Web Key Set
      description: |
        Returns public keys for verifying JWTs issued by this service.
        Includes both active and retired keys (for rotation grace period).
        
        **Caching**: 
        - Server-side: Valkey cache (TTL: 10 minutes, configurable)
        - Client-side: Cache-Control header (max-age=300)
      tags:
        - JWKS
      responses:
        '200':
          description: JWKS response
          headers:
            Cache-Control:
              description: HTTP caching directive
              schema:
                type: string
                example: "public, max-age=300"
            Content-Type:
              schema:
                type: string
                example: "application/json"
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/JWK'
              example:
                keys:
                  - kty: "EC"
                    use: "sig"
                    alg: "ES256"
                    kid: "janus-key-abc123"
                    crv: "P-256"
                    x: "f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU"
                    y: "x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"
        '500':
          description: Failed to retrieve JWKS
          content:
            text/plain:
              schema:
                type: string
                example: "Failed to retrieve JWKS"

  /health:
    get:
      summary: Health check endpoint
      description: Returns service health status
      tags:
        - Health
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  version:
                    type: string
                    example: "1.0.0"

  /metrics:
    get:
      summary: Prometheus metrics
      description: Exposes Prometheus metrics for monitoring
      tags:
        - Health
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total Total HTTP requests
                  # TYPE http_requests_total counter
                  http_requests_total{method="GET",path="/health",status="200"} 42

components:
  schemas:
    JWK:
      type: object
      description: JSON Web Key (public key for JWT verification)
      required:
        - kty
        - use
        - alg
        - kid
        - crv
        - x
        - y
      properties:
        kty:
          type: string
          description: Key type
          example: "EC"
        use:
          type: string
          description: Key usage
          example: "sig"
        alg:
          type: string
          description: Algorithm
          example: "ES256"
        kid:
          type: string
          description: Key ID
          example: "janus-key-abc123"
        crv:
          type: string
          description: ECDSA curve name
          example: "P-256"
        x:
          type: string
          description: ECDSA X coordinate (Base64url encoded)
          example: "f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU"
        y:
          type: string
          description: ECDSA Y coordinate (Base64url encoded)
          example: "x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: Opaque session cookie (HttpOnly, Secure, SameSite=Lax)
