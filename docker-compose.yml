version: '3.8'

services:
  valkey:
    image: valkey/valkey:9-alpine
    container_name: secure-token-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: secure-token-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  secure-token-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-token-service
    ports:
      - "8080:8080"  # HTTP server
      - "9090:9090"  # gRPC server
    env_file:
      - .env.local
    depends_on:
      valkey:
        condition: service_started
      postgres:
        condition: service_started
    restart: unless-stopped

volumes:
  valkey_data:
    driver: local
  postgres_data:
    driver: local
