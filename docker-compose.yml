version: '3.8'

services:
  valkey:
    image: valkey/valkey:9-alpine
    container_name: secure-token-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: secure-token-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  secure-token-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-token-service
    ports:
      - "8080:8080"  # HTTP server
      - "9090:9090"  # gRPC server
    environment:
      # Cache (Valkey) configuration
      CACHE_ADDR: "valkey:6379"
      CACHE_PASSWORD: ""
      CACHE_DB: "0"
      
      # Server configuration
      HTTP_PORT: "8080"
      GRPC_PORT: "9090"
      
      # JWT configuration
      JWT_ISSUER: "session-service"
      JWT_AUDIENCE: "internal-services"
      JWT_EXPIRY: "3600"

      # Cookie Encryption (CHANGE THIS IN PRODUCTION!)
      COOKIE_KEY: "0123456789012345678901234567890123456789012345678901234567890123"

      # OIDC Configuration (Update with your provider)
      OIDC_PROVIDER_URL: "https://accounts.google.com"
      OIDC_CLIENT_ID: "your-client-id"
      OIDC_CLIENT_SECRET: "your-client-secret"
      OIDC_REDIRECT_URL: "http://localhost:8080/auth/callback"
      
      # Database configuration
      DATABASE_URL: "postgres://postgres:password@postgres:5432/sts?sslmode=disable"
    depends_on:
      - valkey
      - postgres
    restart: unless-stopped

volumes:
  valkey_data:
    driver: local
  postgres_data:
    driver: local
