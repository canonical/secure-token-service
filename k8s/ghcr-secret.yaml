apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: default
type: kubernetes.io/dockerconfigjson
data:
  # This should be a base64-encoded Docker config JSON
  # Create with: kubectl create secret docker-registry ghcr-credentials \
  #   --docker-server=ghcr.io \
  #   --docker-username=<github-username> \
  #   --docker-password=<github-personal-access-token> \
  #   --docker-email=<email>
  # Or use the example below and replace with your encoded credentials:
  # .dockerconfigjson: <base64-encoded-docker-config>
---
# To create this secret manually, use:
# kubectl create secret docker-registry ghcr-credentials \
#   --docker-server=ghcr.io \
#   --docker-username=YOUR_GITHUB_USERNAME \
#   --docker-password=YOUR_GITHUB_PAT \
#   --docker-email=YOUR_EMAIL \
#   --namespace=default
#
# For creating the base64-encoded value:
# echo -n '{"auths":{"ghcr.io":{"username":"USERNAME","password":"TOKEN","email":"EMAIL","auth":"BASE64_OF_USERNAME:TOKEN"}}}' | base64 -w0
