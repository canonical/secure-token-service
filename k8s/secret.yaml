apiVersion: v1
kind: Secret
metadata:
  name: secure-token-service-secret
  labels:
    app: secure-token-service
type: Opaque
stringData:
  # Cache (Valkey/Redis) Password
  CACHE_PASSWORD: ""  # Set this to your Valkey password if authentication is enabled
  
  # Cookie Encryption Keys
  # ⚠️ CRITICAL: Generate a strong random key for production using:
  #   COOKIE_KEY: openssl rand -hex 32  (outputs 64 chars for 32 bytes)
  COOKIE_KEY: "0123456789012345678901234567890123456789012345678901234567890123"  # ⚠️ CHANGE IN PRODUCTION
  
  # Database URL (including credentials)
  # Format: postgres://username:password@host:port/database?sslmode=require
  DATABASE_URL: "postgres://stsuser:stspassword@postgresql.data.svc.cluster.local:5432/sts?sslmode=disable"
  
  # OIDC Client Credentials
  # ⚠️ REPLACE WITH YOUR ACTUAL OIDC PROVIDER VALUES
  OIDC_CLIENT_ID: "your-oidc-client-id-from-provider"
  OIDC_CLIENT_SECRET: "your-oidc-client-secret-from-provider"
