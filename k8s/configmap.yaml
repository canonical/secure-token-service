apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-token-service-config
  labels:
    app: secure-token-service
data:
  # HTTP Server
  HTTP_PORT: "8080"
  
  # gRPC Server
  GRPC_PORT: "9090"
  
  # Cache (Valkey)
  CACHE_ADDR: "valkey-primary.data.svc.cluster.local:6379"
  CACHE_DB: "0"
  
  # JWT Settings
  JWT_ISSUER: "secure-token-service"
  JWT_AUDIENCE: "internal-services"
  JWT_EXPIRY: "3600"  # 1 hour in seconds
  SESSION_EXPIRY: "86400"  # 1 day in seconds
  
  # JWKS Caching
  JWKS_CACHE_TTL: "600"  # 10 minutes in seconds
  
  # Upstream Hydra JWKS Configuration (M2M Token Exchange)
  HYDRA_JWKS_URL: ""  # Optional: defaults to ${OIDC_PROVIDER_URL}/.well-known/jwks.json if empty
  
  # OIDC Configuration (non-sensitive)
  OIDC_PROVIDER_URL: "https://accounts.google.com"
  OIDC_REDIRECT_URL: "https://example.com/auth/callback"
  OIDC_SCOPES: "openid,profile,email,offline_access"
  
  # Observability
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  TRACING_ENDPOINT: ""  # Leave empty to disable, or set to OTLP endpoint
  TRACING_SAMPLE_RATE: "0.1"
  SERVICE_NAME: "secure-token-service"
  SERVICE_VERSION: "1.0.0"
  
  # Note: Sensitive values should be in Secret, not ConfigMap:
  # - CACHE_PASSWORD (Secret)
  # - COOKIE_HASH_KEY (Secret)
  # - COOKIE_BLOCK_KEY (Secret)
  # - OIDC_CLIENT_ID (Secret)
  # - OIDC_CLIENT_SECRET (Secret)
