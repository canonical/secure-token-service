version: 1

# Declarative code-to-spec drift checks for the Secure Token Service (STS).
# Consumed by `openspec-drift` / `python3 scripts/check_openspec_drift.py`
# (`openspec_harness.drift.check_drift`). Each top-level key is a baseline
# spec id (an active `openspec validate` target) or an archived change id;
# each entry maps a check id to a repository file plus `needles` (literal
# substrings, all of which must be present) and/or `regex` patterns (any of
# which must match) and optional `must_exist` (default true).
checks:
  artifact-security-gate:
    - id: pr_vuln_and_elf_gate
      path: .github/workflows/unittest.yaml
      needles:
        - make govulncheck
        - make build-all
        - x86-64
        - aarch64
        - RISC-V
    - id: candidate_scan_and_promote_gate
      path: .github/workflows/ci.yaml
      needles:
        - _rock-scan.yaml
        - _rock-promote.yaml
        - gh-publish-candidate

  m2m-token-exchange:
    - id: proto_exchange_token_rpc
      path: api/proto/v1/sts.proto
      needles:
        - rpc ExchangeToken
        - ExchangeTokenRequest
        - ExchangeResponse
    - id: hydra_preemptive_jwks_verifier
      path: internal/auth/hydra.go
      needles:
        - HydraTokenVerifier
        - jwkfetch.NewCache
        - ErrTokenExpiringSoon
        - 5 * time.Second
    - id: grpc_exchange_token_handler
      path: internal/grpc/server.go
      needles:
        - ExchangeToken
        - "65536"
        - "@serviceaccount.local"
        - codes.InvalidArgument
        - codes.Unauthenticated

  support-multi-arch-rocks-and-pipelines:
    - id: makefile_three_arch_binaries
      path: Makefile
      needles:
        - "BINARY_ARCHS?=amd64 arm64 riscv64"
        - "build-all:"
    - id: rockcraft_two_arch_platforms
      path: rockcraft.yaml
      needles:
        - "amd64:"
        - "arm64:"
        - CRAFT_ARCH_BUILD_FOR
    - id: skaffold_and_dockerfile_multiarch
      path: skaffold.yaml
      needles:
        - linux/amd64
        - linux/arm64

  support-ubuntu-one-openid:
    - id: ubuntu_one_openid_client
      path: internal/auth/openid/ubuntuone.go
      needles:
        - check_authentication
        - openid.ns.sreg
        - openid.ns.ax
        - response_nonce
    - id: standardized_cookie_manager
      path: internal/cookie/cookie.go
      needles:
        - SetSessionCookie
        - ClearSessionCookie
        - SameSiteLaxMode
        - X-Forwarded-Proto
    - id: http_openid_callback_route
      path: internal/http/server.go
      needles:
        - /auth/openid/callback
        - handleOpenIDCallback
        - handleLogin
    - id: openapi_provider_and_callback_contract
      path: docs/api/openapi.yaml
      needles:
        - /auth/openid/callback
        - provider

  claims-normalization:
    - id: oidc_tenant_and_u1_sso_claim_config
      path: internal/config/config.go
      needles:
        - OIDCTenantClaim
        - OIDC_TENANT_CLAIM
        - OIDCU1SSOIDClaim
        - OIDC_U1_SSO_ID_CLAIM
    - id: oidc_email_verified_and_claims
      path: internal/http/server.go
      needles:
        - normalizeOIDCClaims
        - email_verified
        - u1_sso_id
    - id: openid_u1_sso_id_claim
      path: internal/auth/openid/ubuntuone.go
      needles:
        - u1_sso_id
        - ExtractU1SSOID
        - IsValidU1SSOID
    - id: grpc_exchange_session_token_format
      path: internal/grpc/server.go
      needles:
        - u1_sso_id
        - ValidateIdentity
        - strings.EqualFold(sess.Provider, "openid")
    - id: session_identity_validation
      path: internal/session/store.go
      needles:
        - ValidateIdentity
        - ErrInvalidSessionIdentity
    - id: session_extend_unified_expiry
      path: cmd/sts/extend_sessions.go
      needles:
        - extendOneSession
        - ValidateIdentity
        - time.Now().UTC().Add(ttl)
  session-whoami:
    - id: http_me_route_and_headers
      path: internal/http/server.go
      needles:
        - /auth/me
        - handleMe
        - Cache-Control
        - no-store
        - normalizeOIDCClaims
        - u1_sso_id
    - id: openapi_me_contract
      path: docs/api/openapi.yaml
      needles:
        - /auth/me
        - MeResponse
        - u1_sso_id
  session-management:
    - id: valkey_session_crud_methods
      path: internal/session/store.go
      needles:
        - ListUserSessions
        - DeleteUserSession
        - RevokeUserSessionsExcept
    - id: http_sessions_crud_routes
      path: internal/http/server.go
      needles:
        - /auth/sessions/{session_id}
        - handleSessions
        - handleRevokeSession
        - handleRevokeAllSessions
        - NewCrossOriginProtection
    - id: metrics_parameterized_route_pattern
      path: internal/observability/metrics.go
      needles:
        - routePatternForMetrics
        - RoutePattern
    - id: openapi_sessions_contract
      path: docs/api/openapi.yaml
      needles:
        - /auth/sessions
        - /auth/sessions/{session_id}