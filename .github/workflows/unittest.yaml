name: unit test
run-name: Unit test steps for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          check-latest: true

      - name: Run vulnerability check
        run: make govulncheck

      - name: Build binaries for all supported architectures
        run: make build-all

      - name: Verify binary architectures
        run: |
          file bin/app-linux-amd64 | grep -q 'x86-64'
          file bin/app-linux-arm64 | grep -q 'aarch64'
          file bin/app-linux-riscv64 | grep -q 'RISC-V'
          for b in bin/app-linux-*; do
            file "$b" | grep -Eq 'x86-64|aarch64|RISC-V' || exit 1
          done

      - name: Install Podman
        uses: redhat-actions/podman-install@main

      - name: Setup podman for rootless (standard GitHub runner user)
        run: systemctl --user enable --now podman.socket

      - name: Build Go code
        run: make test
        env:
          GO_TEST_PARALLEL: 10
          DOCKER_HOST: "unix://$XDG_RUNTIME_DIR/podman/podman.sock"

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.out

      - name: Upload Go test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Go-results
          path: test.json
